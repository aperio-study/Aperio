name: Build desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set desktop directory
        shell: bash
        run: echo "DIR=aperio-desktop" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.DIR }}
        run: npm install

      - name: Build and publish
        shell: bash
        working-directory: ${{ env.DIR }}
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
